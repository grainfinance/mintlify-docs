    AcceptOfflineHedgeProposalRequestBody:
      description: The required parameters when accepting an offline hedge
      properties:
        revision:
          type: number
          format: double
          description: The id of the revision that defines the accepted rate for the currency-pair and tenor.
          example: 156
        fromCurrency:
          type: string
          description: The currency in which the transaction should be paid at by your customer.
          example: MXN
        toCurrency:
          type: string
          description: the currency you want to buy.
          example: USD
        toCurrencyAmount:
          type: number
          format: double
          description: The amount to hedge in the toCurrency.
          example: 100000
        endAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge will be settled, denoted in `YYYY-MM-DD` format.
          example: "2024-02-23"
        rate:
          type: number
          format: double
          description: >-
            Represents the exchange rate according to the offline map of currency pairs to tenor object.


            The calculation of the tenor is based on the difference in calendar days between the 'tenorCalculationDate'
            and the 'endAt' date:


            - If the number of calendar days from 'tenorCalculationDate' to `endAt` is less than or equal to 7, the
            tenor is 7 days.

            - If the number of calendar days from 'tenorCalculationDate' to `endAt` is greater than 7 and less than or
            equal to 14, the tenor is 14 days.

            - If the number of calendar days from 'tenorCalculationDate' to `endAt` is greater than 14 and less than or
            equal to 30, the tenor is 30 days.

            - If the number of calendar days from 'tenorCalculationDate' to `endAt` is greater than 30 and less than or
            equal to 60, the tenor is 60 days.

            - ...

            - If the number of calendar days from 'tenorCalculationDate' to `endAt` is greater than 330 and less than or
            equal to 360, the tenor is 360 days.


            When counting the difference in calendar days, every day is counted as one regardless of the duration of the
            day. This means that the calculation includes all days: weekends, holidays, and weekdays alike.


            For example, if the 'endAt' date is 2023-12-16 and the 'tenorCalculationDate' is 2024-12-15, the result is 1
            calendar day.


            To calculate the difference in calendar days accurately, we recommend using a date manipulation library,
            such as date-fns and its `differenceInCalendarDays` function, or a similar feature provided by other date
            libraries.
          example: 20.616512
        externalTransactionId:
          type: string
          description: Optional The transaction id, as identified within your system.
          example: 780231b3ae0d7e9e5097nd89
        extraFields:
          $ref: "#/components/schemas/ExtraFieldsParam"
      required:
        - revision
        - fromCurrency
        - toCurrency
        - toCurrencyAmount
        - endAt
        - rate
      type: object
      additionalProperties: false
