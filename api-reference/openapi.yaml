        fromCurrencyAmount:
          type: number
          format: double
          description: |-
            The amount to hedge in the fromCurrency.
            If toCurrencyAmount is provided, then fromCurrencyAmount calculated as:
            `fromCurrencyAmount = toCurrencyAmount * quote`
