servers:
  - url: https://api.grainfinance.co/v1
    description: Grain API
tags:
  - name: Hedges
    description: >-
      Hedge objects represent transactions that lock exchange rates for future dates. A single hedge locks an exchange
      rate for a future transaction between two currencies.
  - name: Dual Hedges
    description: >-
      A dual hedge mitigates FX risk by automatically generating two linked hedge legs - a customer leg and a supplier
      leg - both routed through the customer's functional currency. This structure reduces exposure to currency
      fluctuations for both cash flow and accounting purposes, while allowing independent tracking and reporting of each
      hedge leg.
  - name: Customers
    description: >-
      Customer objects represent your end customers on the Grain platform. A customer must be created before a hedge or
      spot transaction can be initiated.
  - name: Pricing
    description: >-
      Pricing endpoints provide access to FX rates for currency pairs that are not being hedged. These endpoints can be
      used for live rate display or bulk retrieval to support high-volume quoting workflows.
  - name: Spots
    description: Spot objects represent currency conversions executed for immediate or near-term settlement.
  - name: Wallets
    description: Endpoints to view balances, manage funding, and perform transfers.
