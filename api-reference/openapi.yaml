info:
  title: Grain API
  version: 1.0.0
  description: >-
    Grain's API provides a comprehensive set of endpoints for managing hedging, spot transactions, pricing, and fund
    movements - enabling seamless integration of FX workflows into your platform. Each API call follows REST
    conventions, uses secure authentication, and returns standardized responses for consistency across environments.
  license:
    name: Creative Commons Attribution 3.0
  contact:
    name: Grain Finance
    url: https://grainfinance.co
    email: support@grainfinance.co
  termsOfService: https://grainfinance.co/terms-of-service/
  x-apiClientRegistration:
    url: https://grainfinance.co/partners
openapi: 3.0.0
paths:
  /customers/{customerId}/hedges/quote:
    post:
      operationId: Real-time Quote
      responses:
        "201":
          description: Hedge Proposal Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCustomerHedgeProposalResponseBody"
              examples:
                toCurrencyAmount:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    fromCurrency: MXN
                    toCurrency: USD
                    quote: 20.6165
                    validUntilTs: 1659625098
                    endAt: "2023-04-15"
                    initialCollateralPercentage: 5
                    toCurrencyAmount: 1560
                    fromCurrencyAmount: 32161.8
                    fixedSide: toCurrencyAmount
                    externalMarkupPct: 1
                fromCurrencyAmount:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    fromCurrency: MXN
                    toCurrency: USD
                    quote: 20.6165
                    validUntilTs: 1659625098
                    endAt: "2023-04-15"
                    initialCollateralPercentage: 5
                    toCurrencyAmount: 1560
                    fromCurrencyAmount: 32161.8
                    fixedSide: fromCurrencyAmount
                    externalMarkupPct: 1
        "400":
          description: The request failed because it is not well-formed or is syntactically incorrect or violates schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The request failed because the resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The request failed because a business rule constraint was violated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: The request failed because one or more preconditions were not met.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The request failed because it is either semantically incorrect or has failed business validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "451":
          description: The request failed due to legal restrictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedByIPError"
      description: >-
        Generates a real-time rate proposal for a new hedge associated with the specified customer. Once accepted, this
        proposal becomes a confirmed hedge.
      tags:
        - Hedges
      security:
        - api-key: []
      parameters:
        - description: The id of the customer within the Grain platform.
          in: path
          name: customerId
          required: true
          schema:
            type: string
        - in: header
          name: X-Customer-IP
          required: true
          schema:
            $ref: "#/components/schemas/CustomerIP"
      requestBody:
        description: The payload required in order to ask for a hedge quote
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HedgeQuoteRequestBody"
              description: The payload required in order to ask for a hedge quote
            examples:
              toCurrencyAmount:
                value:
                  fromCurrency: MXN
                  toCurrency: USD
                  toCurrencyAmount: 1560
                  externalMarkupPct: 1
                  endAt: "2023-02-23"
              fromCurrencyAmount:
                value:
                  fromCurrency: MXN
                  toCurrency: USD
                  fromCurrencyAmount: 25000
                  externalMarkupPct: 1
                  endAt: "2023-02-23"
  /customers/{customerId}/hedges/accept-quote:
    post:
      operationId: Real-time Accept
      responses:
        "200":
          description: Hedge Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerHedge"
              examples:
                CollectionHedge:
                  value:
                    id: 8173b9a7-ee61-413e-b9e3-7c04b2a067c5
                    customerId: 1b0ada1e-fa1b-4cfe-a553-01b340c5650e
                    status: Active
                    transactionId: 4d78ac65-2c3f-47e2-8bf3-3f76124e9d27
                    externalTransactionId: 780231b3ae0d7e9e5097nd89
                    fromCurrency: MXN
                    toCurrency: USD
                    externalCustomerId: 630231b3ae0d7e9e5097ad35
                    toCurrencyAmount: 1560
                    fromCurrencyAmount: 32161.8
                    fixedSide: toCurrencyAmount
                    initialCollateralAmount: 1608.09
                    quote: 20.6165
                    externalMarkupPct: 1
                    acceptedAtTs: 1674057600
                    issuedAt: "2023-01-18"
                    endAt: "2023-02-23"
                    updatedAt: "2023-01-18"
                    cancelledAt: null
                    initialCollateralReceivedAt: null
                    fundsReceivedAt: null
                    completedAt: null
                    completedAtTs: null
                    overdueAt: "2023-02-28"
                    settlementAt: "2023-02-23"
                    settlementType: full
                    adjustedMtmChangePct: 0.0125
                    adjustedMtmChangeTs: 1674144000
                OffsetHedge:
                  value:
                    id: 9284c0b8-ff72-524f-c0f4-8d15c3b178d6
                    customerId: 1b0ada1e-fa1b-4cfe-a553-01b340c5650e
                    status: Active
                    transactionId: 5e89bd76-3d4g-58f3-9cg4-4g87235f0e38
                    externalTransactionId: 891342c4bf1e8f0f6198oe90
                    fromCurrency: EUR
                    toCurrency: USD
                    externalCustomerId: 630231b3ae0d7e9e5097ad35
                    toCurrencyAmount: 5000
                    fromCurrencyAmount: 4650.5
                    fixedSide: toCurrencyAmount
                    initialCollateralAmount: 232.53
                    quote: 1.0751
                    externalMarkupPct: 1
                    acceptedAtTs: 1674057600
                    issuedAt: "2023-01-18"
                    endAt: "2023-02-23"
                    updatedAt: "2023-01-18"
                    cancelledAt: null
                    initialCollateralReceivedAt: null
                    fundsReceivedAt: null
                    completedAt: null
                    completedAtTs: null
                    overdueAt: "2023-02-28"
                    settlementAt: "2023-02-23"
                    settlementType: offset
                    adjustedMtmChangePct: -0.0089
                    adjustedMtmChangeTs: 1674144000
        "400":
          description: The request failed because it is not well-formed or is syntactically incorrect or violates schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The request failed because the resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The request failed because a business rule constraint was violated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: The request failed because one or more preconditions were not met.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The request failed because it is either semantically incorrect or has failed business validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: The request failed because a required precondition was not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "451":
          description: The request failed due to legal restrictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedByIPError"
      description: Accepts a previously generated real-time rate proposal and creates the hedge transaction.
      tags:
        - Hedges
      security:
        - api-key: []
      parameters:
        - description: The id of the customer within the Grain platform.
          in: path
          name: customerId
          required: true
          schema:
            type: string
        - in: header
          name: X-Customer-IP
          required: true
          schema:
            $ref: "#/components/schemas/CustomerIP"
      requestBody:
        description: The payload required in order to accept a hedge
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptHedgeProposalRequestBody"
              description: The payload required in order to accept a hedge
            example:
              hedgeProposalId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
              externalTransactionId: 780231b3ae0d7e9e5097nd89
              extraFields:
                field_a: value_a
                field_b: value_b
  /offline-rates:
    get:
      operationId: Offline Quotes
      responses:
        "200":
          description: Offline Rates Retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOfflineRatesResponse"
        "400":
          description: The request failed because it is not well-formed or is syntactically incorrect or violates schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The request failed because the resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The request failed because it is either semantically incorrect or has failed business validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineRatesInvalidRequestError"
        "500":
          description: The request failed because an internal server error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: >-
        Retrieves offline hedge quote proposals for selected currency pairs. Partners can use these pre-fetched
        proposals - avoiding the need for a real-time quote per transaction.
      tags:
        - Hedges
      security:
        - api-key: []
      parameters:
        - description: |-
            Optional query parameter specifying currency pairs.
            Multiple pairs can be provided as a comma-separated list.
            Please encode the query param beforehand.
            For example, ?pairs=EURUSD%2CGBPEUR represents ?pairs=EURUSD,GBPEUR
          in: query
          name: pairs
          required: false
          schema:
            type: string
  /customers/{customerId}/hedges/accept-offline-quote:
    post:
      operationId: Offline Accept
      responses:
        "200":
          description: Hedge Accepted
          content:
            application/json:
