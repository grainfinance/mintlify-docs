    AcceptOfflineHedgeResponseBody:
      description: The response of accepting an offline rate for a hedge.
      properties:
        id:
          $ref: "#/components/schemas/UUID"
          description: The id of the created object.
          example: 1b0ada1e-fa1b-4cfe-a553-01b340c5650e
        transactionId:
          $ref: "#/components/schemas/UUID"
          description: The id of the transaction within the Grain platform.
