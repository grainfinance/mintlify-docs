        field_b: value_b
      description: |-
        Additional fields that provide further details about the transaction.
        These fields should be specified as a valid JSON object.
    AcceptOfflineDualHedgeProposalRequestBody:
      properties:
        revision:
          type: number
          format: double
          description: The id of the revision that defines the accepted rate for the currency-pair and tenor.
          example: 156
        fromCurrency:
          type: string
          description: The currency in which the transaction should be paid by your customer.
          example: MXN
        toCurrency:
          type: string
          description: The currency you want to buy.
          example: USD
        customerToCurrencyAmount:
          type: number
          format: double
          description: The amount to hedge in the toCurrency for the customer.
          example: 100000
        vendorToCurrencyAmount:
          type: number
          format: double
          description: The amount to hedge in the toCurrency for the vendor.
          example: 100000
        customerEndAt:
          type: string
          description: The date in which the customer hedge will be settled, denoted in `YYYY-MM-DD` format.
          example: "2024-02-23"
        vendorEndAt:
          type: string
          description: The date in which the vendor hedge will be settled, denoted in `YYYY-MM-DD` format.
          example: "2024-02-23"
        rate:
          type: number
          format: double
          description: >-
            Represents the offline hedge rate determined by a two-dimensional lookup based on the vendor and customer
            tenors.


            **Calculating Tenors:**


            Tenors are calculated from the calendar-day difference between the tenorCalculationDate and the
            vendor/customer end dates, then mapped into the nearest supported tenor bucket:


            -

            - > 0 and ≤ 7 calendar days → 7-day tenor

            - > 7 and ≤ 14 calendar days → 14-day tenor

            - > 14 and ≤ 30 calendar days → 30-day tenor

            - > 30 and ≤ 60 calendar days → 60-day tenor

            - > 60 and ≤ 90 calendar days → 90-day tenor

            - … continues in similar ranges up to 720 days


            **Note:** All calendar days count — weekends and holidays included.


            **Rate Lookup Example:**


            The rate is retrieved from a two-dimensional map using both tenors:

            ```

            "USDMXN": {
              "7": { "7": 1.1 },
              "14": { "7": 1.2, "14": 1.3 },
              "30": { "7": 1.1, "14": 1.1, "30": 1.1 },
              // ... and so on
            }

            ```


            In this example, if the vendor tenor is 14 days and the customer tenor is 7 days, the rate would be 1.2.


            To calculate the difference in calendar days accurately, we recommend using a date manipulation library,
            such as date-fns and its `differenceInCalendarDays` function, or a similar feature provided by other date
            libraries.
          example: 20.616512
        externalTransactionId:
          type: string
          description: The transaction id, as identified within your system.
          example: 780231b3ae0d7e9e5097nd89
        extraFields:
          $ref: "#/components/schemas/ExtraFieldsParam"
      required:
        - revision
        - fromCurrency
        - toCurrency
        - customerToCurrencyAmount
        - vendorToCurrencyAmount
        - customerEndAt
        - vendorEndAt
        - rate
        - externalTransactionId
      type: object
      additionalProperties: false
    CustomerIP:
      type: string
      format: IPv4
      description: |-
        The IPv4 address of the browser from which the customer contacts your platform. <br />
        _example_: `192.158.1.38`
      pattern: ((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.?\b){4}
    GrainDateFormat:
      type: string
      example: "2023-04-15"
      format: YYYY-MM-DD
      description: The date format accepted by Grain's API. We accept dash separated ISO-8601 date-only strings.
      pattern: \d{4}-\d{2}-\d{2}
    DisplaySettlementType.Full:
      enum:
        - full
      type: string
    HedgeStatus:
      enum:
        - Active
        - Cancelled
        - Completed
        - InProcess
        - Overdue
      type: string
    DisplayFixedSide:
      description: |-
        The fixed side as displayed in external APIs (camelCase format).
        Indicates which currency amount was specified when creating the hedge.
      enum:
        - toCurrencyAmount
        - fromCurrencyAmount
      type: string
    DisplaySettlementType:
      description: |-
        The settlement type as displayed in the Partners API.
        Maps internal settlement types to simplified external values.
      enum:
        - full
        - offset
        - manual
      type: string
    CollectionHedge:
      properties:
        id:
          $ref: "#/components/schemas/UUID"
          description: The id of the hedge within the Grain platform.
          example: 8173b9a7-ee61-413e-b9e3-7c04b2a067c5
        customerId:
          $ref: "#/components/schemas/UUID"
          description: The id of the customer within the Grain platform.
          example: 1b0ada1e-fa1b-4cfe-a553-01b340c5650e
        status:
          $ref: "#/components/schemas/HedgeStatus"
          description: The Status of the Hedge
          example: Active
        transactionId:
          $ref: "#/components/schemas/UUID"
          description: The id of the transaction within the Grain platform.
          example: 4d78ac65-2c3f-47e2-8bf3-3f76124e9d27
        externalTransactionId:
          type: string
          description: The transaction id as identified within your system.
          example: 780231b3ae0d7e9e5097nd89
        fromCurrency:
          type: string
          description: The currency in which the transaction should be paid at by your customer.
          example: MXN
        toCurrency:
          type: string
          description: The currency in which the inventory item is listed at on your platform.
          example: USD
        externalCustomerId:
          type: string
          description: The id used to identify the customer within your platform
          example: 630231b3ae0d7e9e5097ad35
        toCurrencyAmount:
          type: number
          format: double
          description: |-
            The amount to hedge in the toCurrency.
            If fromCurrencyAmount is provided, then toCurrencyAmount calculated as:
            `toCurrencyAmount = fromCurrencyAmount / quote`
          example: 1560
        fromCurrencyAmount:
          type: number
          format: double
          description: |-
            The amount to hedge in the fromCurrency.
            If toCurrencyAmount is provided, then fromCurrencyAmount calculated as:
            `fromCurrencyAmount = toCurrencyAmount * quote`
          example: 32161.8
        fixedSide:
          $ref: "#/components/schemas/DisplayFixedSide"
          description: >-
            Indicates which currency amount was fixed (specified) when creating the hedge.

            When `fixedSide` is `toCurrencyAmount`, the `toCurrencyAmount` was specified and `fromCurrencyAmount` was
            calculated.

            When `fixedSide` is `fromCurrencyAmount`, the `fromCurrencyAmount` was specified and `toCurrencyAmount` was
            calculated.
          example: toCurrencyAmount
        initialCollateralAmount:
          type: number
          format: double
          description: |-
            The initial collateral amount required for this hedge in the fromCurrency.
            Calculated as fromCurrencyAmount * initialCollateralPercentage.
          example: 1608.09
        quote:
          type: number
          format: double
          description: The rate locked by this hedge.
          example: 20.6165
        externalMarkupPct:
          type: number
          format: double
          nullable: true
          description: |-
            The external markup percentage that should be added to this quote on top of Grain’s internal pricing.
            For example, a value of 1.0 represents a 1.0% additional markup.
          example: 1
        acceptedAtTs:
          type: number
          format: double
          description: The unix timestamp in which the hedge offer was accepted (if it was).
          example: 1659625088
        issuedAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge was issued, denoted in `YYYY-MM-DD` format.
          example: "2023-01-18"
        endAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge will be settled, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        updatedAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge was last modified, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        cancelledAt:
          allOf:
            - $ref: "#/components/schemas/GrainDateFormat"
          nullable: true
          description: The date in which the hedge was cancelled, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        initialCollateralReceivedAt:
          allOf:
            - $ref: "#/components/schemas/GrainDateFormat"
          nullable: true
          description: |-
            The date in which the initial collateral was received, denoted in `YYYY-MM-DD` format.
            Null if not yet received.
          example: "2023-01-20"
        fundsReceivedAt:
          allOf:
            - $ref: "#/components/schemas/GrainDateFormat"
          nullable: true
          description: >-
            The date in which the funds of the hedge arrived, afterwards the settlement occurs denoted in `YYYY-MM-DD`
            format.
          example: "2023-02-23"
        completedAt:
          allOf:
            - $ref: "#/components/schemas/GrainDateFormat"
          nullable: true
          description: The date in which the hedge was completed, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        completedAtTs:
          type: number
          format: double
          nullable: true
          description: The unix timestamp in which the hedge was completed.
          example: 1659625090
        overdueAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge will become overdue, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        settlementAt:
          $ref: "#/components/schemas/GrainDateFormat"
          description: The date in which the hedge begins settlement, denoted in `YYYY-MM-DD` format.
          example: "2023-02-23"
        settlementType:
          $ref: "#/components/schemas/DisplaySettlementType.Full"
          description: |-
            The method in which the hedge is being settled.
            If 'full' type is set, the total hedge amount should be sent to Grain prior to settlement
        adjustedMtmChangePct:
          type: number
          format: double
          nullable: true
          description: The percentage change in the adjusted mark-to-market value since the previous valuation
          example: 0.0125
        adjustedMtmChangeTs:
          type: number
          format: double
          nullable: true
          description: The timestamp at which the latest adjusted mark-to-market change was calculated.
          example: 1674057600
      required:
        - id
        - customerId
        - status
        - transactionId
        - externalTransactionId
        - fromCurrency
        - toCurrency
        - externalCustomerId
        - toCurrencyAmount
        - fromCurrencyAmount
        - fixedSide
        - initialCollateralAmount
        - quote
        - externalMarkupPct
        - acceptedAtTs
        - issuedAt
        - endAt
        - updatedAt
        - cancelledAt
        - initialCollateralReceivedAt
        - fundsReceivedAt
        - completedAt
        - completedAtTs
        - overdueAt
        - settlementAt
        - settlementType
        - adjustedMtmChangePct
        - adjustedMtmChangeTs
      type: object
      additionalProperties: false
    DisplaySettlementType.Offset:
      enum:
        - offset
      type: string
